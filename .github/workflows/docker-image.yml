name: Docker Image CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: commercefabricregistry.azurecr.io
  ACR_IMAGE_NAME: products-microservice
  DOCKERHUB_IMAGE_NAME: danielmusselwhite/commercefabric_product_microservice

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set your version here, or replace this with however
      # you determine the application version.
      - name: Set product version
        run: echo "PRODUCT_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name commercefabricregistry

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --file CommerceFabric.ProductService/Dockerfile \
            --tag $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:$PRODUCT_VERSION \
            --tag $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:latest \
            --tag $DOCKERHUB_IMAGE_NAME:$PRODUCT_VERSION \
            --tag $DOCKERHUB_IMAGE_NAME:latest \
            .

      - name: Push to Azure Container Registry
        if: github.event_name == 'push'
        run: |
          docker push $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:$PRODUCT_VERSION
          docker push $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:latest

      - name: Push to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push $DOCKERHUB_IMAGE_NAME:$PRODUCT_VERSION
          docker push $DOCKERHUB_IMAGE_NAME:latest
