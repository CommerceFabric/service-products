name: Docker Image CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: commercefabricregistry.azurecr.io
  IMAGE_NAME: products-microservice

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name commercefabricregistry

      - name: Build Docker image
        run: |
          docker build \
            --file CommerceFabric.ProductService/Dockerfile \
            --tag $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            --tag $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest
